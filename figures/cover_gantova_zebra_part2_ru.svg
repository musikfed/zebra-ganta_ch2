<title id="title">Гантова зебра. Часть вторая. Цена перемещения — обложка</title>
<desc id="desc">Авторская инженерная обложка: поверхность магнитной пластины с концентрическими дорожками, линиями магнитных областей, рычагом головки и логической ступенчатой трассой LBA. Схема художественная, не физический снимок реальной геометрии HDD.</desc>
