<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img"><title>Рис. 2.2. Конфигурация измерительного стенда</title><desc>Схема, не измерительный график. Acer Swift 3, USB host AMD, USB-SATA JMicron, HDD HGST.</desc><rect width="1000" height="620" fill="#fff"/><text x="52" y="55" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#172638">Рис. 2.2. Конфигурация измерительного стенда</text><text x="52" y="88" font-family="Arial,sans-serif" font-size="17" fill="#526170">Схема подключения. Скорость линии USB не установлена.</text><rect x="55" y="180" width="255" height="190" rx="18" fill="#eff4f7" stroke="#55718a" stroke-width="2"/><text x="182" y="225" text-anchor="middle" font-size="21" font-weight="bold" font-family="Arial">Acer Swift 3</text><text x="182" y="260" text-anchor="middle" font-size="17" font-family="Arial">Windows 11 Pro</text><text x="182" y="287" text-anchor="middle" font-size="17" font-family="Arial">Ryzen 5 3500U</text><text x="182" y="315" text-anchor="middle" font-size="17" font-family="Arial">Python 3.14.4 / uv</text><text x="182" y="342" text-anchor="middle" font-size="15" font-family="Arial">PhysicalDrive2, read-only</text><path d="M310 276 H393" stroke="#ca792a" stroke-width="4"/><path d="M393 276 l-13 -9 v18z" fill="#ca792a"/><text x="352" y="254" text-anchor="middle" font-size="15" font-family="Arial">USB</text><rect x="396" y="213" width="210" height="128" rx="14" fill="#fff0dc" stroke="#ca792a" stroke-width="2"/><text x="501" y="250" text-anchor="middle" font-size="20" font-weight="bold" font-family="Arial">JMicron</text><text x="501" y="280" text-anchor="middle" font-size="16" font-family="Arial">USB–SATA</text><text x="501" y="305" text-anchor="middle" font-size="15" font-family="Arial">мост / адаптер</text><path d="M606 276 H685" stroke="#ca792a" stroke-width="4"/><path d="M685 276 l-13 -9 v18z" fill="#ca792a"/><text x="646" y="254" text-anchor="middle" font-size="15" font-family="Arial">SATA</text><rect x="690" y="180" width="255" height="190" rx="18" fill="#edf2f7" stroke="#55718a" stroke-width="2"/><text x="817" y="220" text-anchor="middle" font-size="20" font-weight="bold" font-family="Arial">HGST</text><text x="817" y="249" text-anchor="middle" font-size="16" font-family="Arial">HTS725050B7E630</text><text x="817" y="280" text-anchor="middle" font-size="17" font-family="Arial">500 ГБ · HDD</text><text x="817" y="310" text-anchor="middle" font-size="17" font-family="Arial">Disk 2 · T: NTFS</text><text x="817" y="338" text-anchor="middle" font-size="15" font-family="Arial">Только чтение</text><text x="52" y="431" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#172638">Что подтверждено:</text><text x="52" y="462" font-family="Arial,sans-serif" font-size="16" fill="#344">• Два AMD USB 3.10 хост-контроллера — OK; это не скорость линии HGST.</text><text x="52" y="491" font-family="Arial,sans-serif" font-size="16" fill="#344">• Наблюдаемая скорость чтения — около 37–38 МБ/с.</text><text x="52" y="520" font-family="Arial,sans-serif" font-size="16" fill="#344">• Полный ATA SMART через текущий мост пока недоступен (Error=5).</text><text x="52" y="592" font-family="Arial,sans-serif" font-size="14" fill="#526170">PEGINELAB · Греп Пайп · 12.11.2026 · эксперимент №001 · предварительные данные</text></svg>