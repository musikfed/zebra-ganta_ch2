,Liberation Sans,Arial,sans-serif" font-size="17" fill="#506476" font-weight="400" text-anchor="start">Windows 11 Pro · Python 3.14.4</text><text x="82" y="369" font-family="DejaVu Sans,Liberation Sans,Arial,sans-serif" font-size="17" fill="#506476" font-weight="400" text-anchor="start">Чтение PhysicalDrive2</text><text x="82" y="401" font-family="DejaVu Sans,Liberation Sans,Arial,sans-serif" font-size="17" fill="#506476" font-weight="400" text-anchor="start">Результаты: диск F:</text><rect x="446" y="226" width="294" height="247" rx="10" fill="#f7fafb" stroke="#e3eaee" stroke-width="2"/><rect x="446" y="226" width="7" height="247" rx="3" fill="#b65b19" stroke="none" stroke-width="1"/><text x="466" y="268" font-family="DejaVu Sans,Liberation Sans,Arial,sans-serif" font-size="23" fill="#162a38" font-weight="700" text-anchor="start">Мост JMicron</text><text x="466" y="305" font-family="DejaVu Sans,Liberation Sans,Arial,sans-serif" font-size="17" fill="#506476" font-weight="400" text-anchor="start">Подключение USB–SATA</text><text x="466" y="337" font-family="DejaVu Sans,Liberation Sans,Arial,sans-serif" font-size="17" fill="#506476" font-weight="400" text-anchor="start">Устройство определяется как USB</text><text x="466" y="369" font-family="DejaVu Sans,Liberation Sans,Arial,sans-serif" font-size="17" fill="#506476" font-weight="400" text-anchor="start">Скорость линии не определена</text><text x="466" y="401" font-family="DejaVu Sans,Liberation Sans,Arial,sans-serif" font-size="17" fill="#506476" font-weight="400" text-anchor="start">Возможное узкое место</text><rect x="803" y="226" width="335" height="247" rx="10" fill="#f7fafb" stroke="#e3eaee" stroke-width="2"/><rect x="803" y="226" width="7" height="247" rx="3" fill="#31715b" stroke="none" stroke-width="1"/><text x="823" y="268" font-family="DejaVu Sans,Liberation Sans,Arial,sans-serif" font-size="23" fill="#162a38" font-weight="700" text-anchor="start">HGST 500 ГБ</text><text x="823" y="305" font-family="DejaVu Sans,Liberation Sans,Arial,sans-serif" font-size="17" fill="#506476" font-weight="400" text-anchor="start">HTS725050B7E630</text><text x="823" y="337" font-family="DejaVu Sans,Liberation Sans,Arial,sans-serif" font-size="17" fill="#506476" font-weight="400" text-anchor="start">Диск 2 · том T: · NTFS</text><text x="823" y="369" font-family="DejaVu Sans,Liberation Sans,Arial,sans-serif" font-size="17" fill="#506476" font-weight="400" text-anchor="start">7200 об/мин (паспорт)</text><text x="823" y="401" font-family="DejaVu Sans,Liberation Sans,Arial,sans-serif" font-size="17" fill="#506476" font-weight="400" text-anchor="start">Тестирование: только чтение</text><line x1="382" y1="340" x2="446" y2="340" stroke="#b65b19" stroke-width="4"/><path d="M446 340l-15 -9v18z" fill="#b65b19"/><line x1="740" y1="340" x2="803" y2="340" stroke="#b65b19" stroke-width="4"/><path d="M803 340l-15 -9v18z" fill="#b65b19"/><text x="413" y="321" font-family="DejaVu Sans,Liberation Sans,Arial,sans-serif" font-size="16" fill="#b65b19" font-weight="700" text-anchor="middle">USB</text><text x="771" y="321" font-family="DejaVu Sans,Liberation Sans,Arial,sans-serif" font-size="16" fill="#b65b19" font-weight="700" text-anchor="middle">SATA</text><rect x="62" y="518" width="1076" height="121" rx="10" fill="#f4f7f8" stroke="none" stroke-width="1"/><text x="83" y="553" font-family="DejaVu Sans,Liberation Sans,Arial,sans-serif" font-size="19" fill="#162a38" font-weight="700" text-anchor="start">ЧТО ПОДТВЕРЖДЕНО:</text><text x="83" y="586" font-family="DejaVu Sans,Liberation Sans,Arial,sans-serif" font-size="18" fill="#506476" font-weight="400" text-anchor="start">Два хост-контроллера AMD USB 3.10 имеют статус OK.</text><text x="83" y="612" font-family="DejaVu Sans,Liberation Sans,Arial,sans-serif" font-size="18" fill="#b65b19" font-weight="700" text-anchor="start">Это НЕ подтверждает скорость конкретного подключения HGST.</text><line x1="62" y1="688" x2="1138" y2="688" stroke="#e3eaee" stroke-width="2"