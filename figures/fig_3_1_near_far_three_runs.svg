<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 660" width="1160" height="660" role="img"><title>Рис. 3.1. Наблюдаемая задержка близких и дальних чтений, три серии</title><desc>Медианные времена на HGST через USB-JMicron: близкие 10.8974, 10.9594, 10.9342 мс, дальние 17.0894, 17.1212, 19.0528 мс; сравнение не является механическим временем перемещения головки.</desc><rect width="1160" height="660" fill="#fff"/><rect width="1160" height="9" fill="#195d7f"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="60" y="49" font-size="20" font-weight="bold" fill="#195d7f">PEGINELAB  /  ГАНТОВА ЗЕБРА  /  ГЛАВА 3</text><text x="60" y="105" font-size="32" font-weight="bold" fill="#1b3343">Задержка коротких чтений после перехода по LBA</text><text x="60" y="144" font-size="19" fill="#586977">HGST 500 ГБ · 4 КиБ · Windows + JMicron USB–SATA · три экспериментальные серии</text><line x1="172" y1="515" x2="1088" y2="515" stroke="#dde7ec"/><text x="151" y="521" text-anchor="end" font-size="18" fill="#556675">0</text><line x1="172" y1="435" x2="1088" y2="435" stroke="#dde7ec"/><text x="151" y="441" text-anchor="end" font-size="18" fill="#556675">5</text><line x1="172" y1="355" x2="1088" y2="355" stroke="#dde7ec"/><text x="151" y="361" text-anchor="end" font-size="18" fill="#556675">10</text><line x1="172" y1="275" x2="1088" y2="275" stroke="#dde7ec"/><text x="151" y="281" text-anchor="end" font-size="18" fill="#556675">15</text><line x1="172" y1="195" x2="1088" y2="195" stroke="#dde7ec"/><text x="151" y="201" text-anchor="end" font-size="18" fill="#556675">20</text><text x="75" y="198" font-size="19" fill="#556675">мс</text><rect x="235" y="340.64" width="64" height="174.36" fill="#277c93"/><rect x="320" y="241.57" width="64" height="273.43" fill="#bd7032"/><text x="267" y="327.64" text-anchor="middle" font-size="17" fill="#1b3343">10,8974</text><text x="352" y="228.57" text-anchor="middle" font-size="17" fill="#1b3343">17,0894</text><text x="310" y="553" text-anchor="middle" font-size="18" fill="#1b3343">Серия 1 · 20 пар</text><rect x="535" y="339.65" width="64" height="175.35" fill="#277c93"/><rect x="620" y="241.06" width="64" height="273.94" fill="#bd7032"/><text x="567" y="326.65" text-anchor="middle" font-size="17" fill="#1b3343">10,9594</text><text x="652" y="228.06" text-anchor="middle" font-size="17" fill="#1b3343">17,1212</text><text x="610" y="553" text-anchor="middle" font-size="18" fill="#1b3343">Серия 2 · 20 пар</text><rect x="835" y="340.05" width="64" height="174.95" fill="#277c93"/><rect x="920" y="210.16" width="64" height="304.84" fill="#bd7032"/><text x="867" y="327.05" text-anchor="middle" font-size="17" fill="#1b3343">10,9342</text><text x="952" y="197.16" text-anchor="middle" font-size="17" fill="#1b3343">19,0528</text><text x="910" y="553" text-anchor="middle" font-size="18" fill="#1b3343">Серия 3 · 40 пар</text><rect x="60" y="578" width="18" height="18" fill="#277c93"/><text x="86" y="593" font-size="17" fill="#1b3343">Близкий переход</text><rect x="293" y="578" width="18" height="18" fill="#bd7032"/><text x="320" y="593" font-size="17" fill="#1b3343">Дальний переход</text><text x="60" y="635" font-size="16" fill="#586977">Источник: консольные медианы 12.11.2026; не отдельное время движения головок.</text></g></svg>