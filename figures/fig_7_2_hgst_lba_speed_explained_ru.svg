<text x="75" y="632" font-family="Arial,sans-serif" font-size="17" fill="#354d5e">Оранжевая линия — медианы 3 чтений через ORICO; синяя пунктирная — ориентир старого USB 2.0.</text>
<text x="75" y="659" font-family="Arial,sans-serif" font-size="17" fill="#354d5e">Спад к концу LBA — ожидаемый профиль многих HDD; сам по себе НЕ признак неисправности.</text>
<text x="75" y="686" font-family="Arial,sans-serif" font-size="17" fill="#354d5e">Это не карта физических дорожек и не проверка эффективности алгоритма «Гантова зебра».</text>
<text x="55" y="735" font-family="Arial,sans-serif" font-size="14" fill="#536576">Источник: data/raw/exp004-usb3-orico/measurements.csv; exp001_hgst_5zones_2026-11-12.csv. Диапазоны и числа из опыта 004.</text>
