<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="white"/><text x="52" y="52" fill="#153d5b" font-family="Arial,sans-serif" font-size="29" font-weight="bold">Где находятся границы «островков» данных?</text><text x="52" y="87" fill="#61707a" font-family="Arial,sans-serif" font-size="17">Рис. 8.1 • УСЛОВНАЯ СХЕМА • Не физическая карта HGST</text><rect x="35" y="130" width="206" height="290" rx="14" fill="#edf6fb" stroke="#4388b4" stroke-width="2"/><text x="138" y="170" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="bold" fill="#193c55">Файл / архив</text><rect x="61" y="221" width="32" height="103" rx="3" fill="#7aacc9"/><rect x="98" y="221" width="32" height="103" rx="3" fill="#e4a164"/><rect x="135" y="221" width="32" height="103" rx="3" fill="#7aacc9"/><rect x="172" y="221" width="32" height="103" rx="3" fill="#7aacc9"/><text x="138" y="366" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#354f60">Границы объекта</text><text x="138" y="393" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#45677e">Видно из файла</text><path d="M246 260 H266 l-8 -8 m8 8 -8 8" fill="none" stroke="#607e91" stroke-width="3"/><rect x="274" y="130" width="206" height="290" rx="14" fill="#edf6fb" stroke="#4388b4" stroke-width="2"/><text x="377" y="170" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="bold" fill="#193c55">Экстенты</text><rect x="299" y="239" width="34" height="38" fill="#7aacc9"/><rect x="338" y="239" width="34" height="86" fill="#e4a164"/><rect x="377" y="239" width="34" height="60" fill="#7aacc9"/><rect x="416" y="239" width="34" height="95" fill="#7aacc9"/><text x="377" y="366" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#354f60">VCN → LCN</text><text x="377" y="393" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#45677e">Доступно через API ОС</text><path d="M485 260 H505 l-8 -8 m8 8 -8 8" fill="none" stroke="#607e91" stroke-width="3"/><rect x="513" y="130" width="206" height="290" rx="14" fill="#edf6fb" stroke="#4388b4" stroke-width="2"/><text x="616" y="170" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="bold" fill="#193c55">Кластеры LCN</text><rect x="537" y="221" width="46" height="52" fill="#7aacc9"/><rect x="591" y="221" width="46" height="52" fill="#7aacc9"/><rect x="645" y="221" width="46" height="52" fill="#e4a164"/><rect x="537" y="283" width="46" height="52" fill="#7aacc9"/><rect x="591" y="283" width="46" height="52" fill="#7aacc9"/><rect x="645" y="283" width="46" height="52" fill="#7aacc9"/><text x="616" y="366" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#354f60">Логика тома</text><text x="616" y="393" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#45677e">Файловая система</text><path d="M724 260 H744 l-8 -8 m8 8 -8 8" fill="none" stroke="#607e91" stroke-width="3"/><rect x="752" y="130" width="206" height="290" rx="14" fill="#edf6fb" stroke="#4388b4" stroke-width="2"/><text x="855" y="170" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="bold" fill="#193c55">Адреса LBA</text><rect x="777" y="256" width="12" height="68" fill="#7aacc9"/><rect x="792" y="256" width="12" height="68" fill="#7aacc9"/><rect x="807" y="256" width="12" height="68" fill="#e4a164"/><rect x="822" y="256" width="12" height="68" fill="#7aacc9"/><rect x="837" y="256" width="12" height="68" fill="#7aacc9"/><rect x="852" y="256" width="12" height="68" fill="#7aacc9"/><rect x="867" y="256" width="12" height="68" fill="#7aacc9"/><rect x="882" y="256" width="12" height="68" fill="#7aacc9"/><rect x="897" y="256" width="12" height="68" fill="#e4a164"/><rect x="912" y="256" width="12" height="68" fill="#7aacc9"/><text x="855" y="366" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#354f60">Адреса диска</text><text x="855" y="393" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#45677e">Логическая абстракция</text><path d="M963 260 H983 l-8 -8 m8 8 -8 8" fill="none" stroke="#607e91" stroke-width="3"/><rect x="991" y="130" width="206" height="290" rx="14" fill="#fff1e8" stroke="#dc8b45" stroke-width="2"/><text x="1094" y="170" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="bold" fill="#193c55">Магнитная поверхность</text><circle cx="1094" cy="268" r="71" fill="#e9e3da" stroke="#aa9b8a" stroke-width="5"/><circle cx="1094" cy="268" r="45" fill="none" stroke="#bdafa1" stroke-width="3"/><circle cx="1094" cy="268" r="15" fill="none" stroke="#bdafa1" stroke-width="3"/><path d="M1015 343 L1074 261" stroke="#3586b0" stroke-width="11" stroke-linecap="round"/><text x="1094" y="366" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#354f60">Реальная геометрия</text><text x="1094" y="393" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#a5581f">Недоступно напрямую</text><rect x="48" y="460" width="1104" height="190" rx="12" fill="#f1f6fa"/><text x="70" y="508" font-family="Arial,sans-serif" font-size="22" fill="#183f5d" font-weight="bold">Важно: логические границы НЕ равны физическим дорожкам.</text><text x="70" y="558" font-family="Arial,sans-serif" font-size="17" fill="#41596c" font-weight="normal">Границы экстентов возможны через FSCTL_GET_RETRIEVAL_POINTERS; координаты головки — неизвестны.</text><text x="70" y="608" font-family="Arial,sans-serif" font-size="17" fill="#41596c" font-weight="normal">Оранжевый: выделенный участок. Точные магнитные границы и сервометки не измерены.</text><text x="55" y="721" font-family="Arial,sans-serif" font-size="14" fill="#667781">Источник: принцип абстракций файловой системы и Windows FSCTL; без измерений магнитной геометрии.</text></svg>